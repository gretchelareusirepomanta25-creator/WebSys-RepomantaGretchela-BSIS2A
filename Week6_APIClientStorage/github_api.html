<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GitHub API Example</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="lab.css">
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-lg navbar-dark site-navbar" aria-label="Main navigation">
			<div class="container"><a class="navbar-brand fw-bold" href="index.html">Web APIs Lab</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNavigation"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="Local_storage.html">Local Storage</a></li><li class="nav-item"><a class="nav-link" href="user_preferences.html">Preferences</a></li><li class="nav-item"><a class="nav-link" href="weather_api.html">Weather</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="github_api.html">GitHub</a></li><li class="nav-item"><a class="nav-link" href="map_api.html">Maps</a></li></ul></div></div>
		</nav>
	</header>
	<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><section class="project-card"><p class="section-kicker">GitHub API</p><h1 class="display-5 fw-bold">GitHub user lookup</h1><div class="input-group mt-4"><input class="form-control" type="text" id="username" placeholder="Enter GitHub username"><button class="btn btn-dark" onclick="getUser()">Get user</button></div><div class="mt-4" id="userResult" aria-live="polite"></div></section></div></div></main>
	<footer class="site-footer py-4"><div class="container">Week 6 Web APIs Laboratory</div></footer>

	<script>
		function getUser() {
			const username = document.getElementById("username").value.trim();
			const result = document.getElementById("userResult");

			if (!username) {
				result.textContent = "Please enter a GitHub username.";
				return;
			}

			const url = `https://api.github.com/users/${encodeURIComponent(username)}`;

			fetch(url)
				.then(response => {
					if (!response.ok) {
						throw new Error("GitHub user not found.");
					}
					return response.json();
				})
				.then(data => {
					result.innerHTML = `
						<h3>${data.name || "No Name Found"}</h3>
						<img src="${data.avatar_url}" alt="${data.login}'s avatar" width="100">
						<p>Public Repos: ${data.public_repos}</p>
						<p>Followers: ${data.followers}</p>
					`;
				})
				.catch(error => {
					result.textContent = error.message;
				});
		}
	</script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
