<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage - User Preferences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lab.css">
</head>
<body>
    <header><nav class="navbar navbar-expand-lg navbar-dark site-navbar" aria-label="Main navigation"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Web APIs Lab</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNavigation"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="Local_storage.html">Local Storage</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="user_preferences.html">Preferences</a></li><li class="nav-item"><a class="nav-link" href="weather_api.html">Weather</a></li><li class="nav-item"><a class="nav-link" href="github_api.html">GitHub</a></li><li class="nav-item"><a class="nav-link" href="map_api.html">Maps</a></li></ul></div></div></nav></header>
    <main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><section class="project-card"><p class="section-kicker">Local storage</p><h1 class="display-5 fw-bold">Choose your preferences</h1>
    
<label>Theme:</label>
    <select id="theme">
        <option value="light">Light Mode</option>
        <option value="dark">Dark Mode</option>
    </select>
 
   
<label>Language:</label>
    <select id="language">
        <option value="en">English</option>
        <option value="es">Spanish</option>
    </select>
 
    <button class="btn btn-dark mt-3" onclick="savePreferences()">Save preferences</button>
    <p class="mt-3 mb-0" id="message" aria-live="polite"></p></section></div></div></main>
    <footer class="site-footer py-4"><div class="container">Week 6 Web APIs Laboratory</div></footer>
 
    <script>
        function savePreferences() {
           let theme = document.getElementById("theme").value;
           let language = document.getElementById("language").value;
           localStorage.setItem("theme", theme);
           localStorage.setItem("language", language);
           applyPreferences();
           document.getElementById("message").innerText = "Preferences Saved!";
        }
 
        function applyPreferences() {
            let savedTheme = localStorage.getItem("theme");
            let savedLanguage = localStorage.getItem("language");
            
            if (savedTheme === "dark") {
               document.body.classList.add("dark-mode");
            } else {
               document.body.classList.remove("dark-mode");
            }
 
           document.getElementById("theme").value = savedTheme || "light";
           document.getElementById("language").value = savedLanguage || "en";
        }
 
        applyPreferences();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
