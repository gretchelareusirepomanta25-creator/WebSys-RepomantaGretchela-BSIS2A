<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Explorer | Week 6 Web APIs Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lab.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark site-navbar" aria-label="Main navigation">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">My Web APIs Lab</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavigation">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="Local_storage.html">Local Storage</a></li>
                        <li class="nav-item"><a class="nav-link" href="user_preferences.html">Preferences</a></li>
                        <li class="nav-item"><a class="nav-link" href="weather_api.html">Weather</a></li>
                        <li class="nav-item"><a class="nav-link" href="github_api.html">GitHub</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="map_api.html">Maps</a></li>
                        <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                            <button class="btn btn-sm btn-light" id="currentLocationButton" type="button">Current location</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-xl-10">
                <section class="project-card">
                    <p class="section-kicker">OpenStreetMap</p>
                    <h1 class="display-5 fw-bold">Explore a location</h1>
                    <p class="text-secondary">Search for a place or use the current-location button in the navbar.</p>

                    <form class="input-group mt-4" id="locationSearchForm">
                        <label class="visually-hidden" for="locationInput">Search location</label>
                        <input class="form-control" id="locationInput" type="search" placeholder="Enter a city, address, or place" autocomplete="street-address">
                        <button class="btn btn-dark" type="submit" id="searchButton">Search location</button>
                    </form>

                    <p class="mt-3 mb-3" id="location-status" role="status" aria-live="polite">Search for a location or choose current location.</p>
                    <div id="map" aria-label="Interactive location map"></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="site-footer py-4"><div class="container">Week 6 Web APIs Laboratory</div></footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const defaultLocation = [14.5995, 120.9842];
        const statusElement = document.getElementById("location-status");
        const searchForm = document.getElementById("locationSearchForm");
        const searchButton = document.getElementById("searchButton");
        const locationInput = document.getElementById("locationInput");
        const currentLocationButton = document.getElementById("currentLocationButton");
        const map = L.map("map").setView(defaultLocation, 5);
        let marker;

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        searchForm.addEventListener("submit", searchLocation);
        currentLocationButton.addEventListener("click", showCurrentLocation);

        function setMapLocation(location, zoom, message) {
            if (!marker) {
                marker = L.marker(location).addTo(map);
            } else {
                marker.setLatLng(location);
            }

            map.setView(location, zoom);
            marker.bindPopup(message).openPopup();
            statusElement.textContent = message;
        }

        async function searchLocation(event) {
            event.preventDefault();
            const query = locationInput.value.trim();

            if (!query) {
                statusElement.textContent = "Please enter a location to search.";
                locationInput.focus();
                return;
            }

            searchButton.disabled = true;
            searchButton.textContent = "Searching...";
            statusElement.textContent = "Searching for that location...";

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`);
                const results = await response.json();

                if (!results.length) {
                    throw new Error("Location not found. Try a more specific search.");
                }

                const result = results[0];
                setMapLocation([Number(result.lat), Number(result.lon)], 14, `Showing: ${result.display_name}`);
            } catch (error) {
                statusElement.textContent = error.message || "Unable to search for that location.";
            } finally {
                searchButton.disabled = false;
                searchButton.textContent = "Search location";
            }
        }

        function showCurrentLocation() {
            if (!navigator.geolocation) {
                statusElement.textContent = "Geolocation is not supported by this browser.";
                return;
            }

            currentLocationButton.disabled = true;
            currentLocationButton.textContent = "Locating...";
            statusElement.textContent = "Requesting your current location...";

            navigator.geolocation.getCurrentPosition(function(position) {
                const location = [position.coords.latitude, position.coords.longitude];
                setMapLocation(location, 16, "Your current location");
                currentLocationButton.disabled = false;
                currentLocationButton.textContent = "Current location";
            }, function(error) {
                statusElement.textContent = `Unable to get your location: ${error.message}`;
                currentLocationButton.disabled = false;
                currentLocationButton.textContent = "Current location";
            }, {
                enableHighAccuracy: true,
                maximumAge: 10000,
                timeout: 10000
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
