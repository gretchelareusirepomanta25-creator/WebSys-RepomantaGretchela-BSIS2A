<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="lab.css">
</head>
<body>
    <header><nav class="navbar navbar-expand-lg navbar-dark site-navbar" aria-label="Main navigation"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Web APIs Lab</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNavigation"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="Local_storage.html">Local Storage</a></li><li class="nav-item"><a class="nav-link" href="user_preferences.html">Preferences</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="weather_api.html">Weather</a></li><li class="nav-item"><a class="nav-link" href="github_api.html">GitHub</a></li><li class="nav-item"><a class="nav-link" href="map_api.html">Maps</a></li></ul></div></div></nav></header>
    <main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><section class="project-card"><p class="section-kicker">OpenWeatherMap API</p><h1 class="display-5 fw-bold">Weather checker</h1><div class="input-group mt-4"><input class="form-control" type="text" id="city" placeholder="Enter city name"><button class="btn btn-dark" onclick="getWeather()">Get weather</button></div><div class="mt-4" id="weatherResult" aria-live="polite"></div></section></div></div></main>
    <footer class="site-footer py-4"><div class="container">Week 6 Web APIs Laboratory</div></footer>
 
    <script>
        function getWeather() {
            let city = document.getElementById("city").value;
            let apiKey = "29f3209f43441201e57112a81d87c2f6"; // Replace with your OpenWeatherMap API key
            let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
 
            fetch(url)
            .then(response => response.json())
            .then(data => {
                document.getElementById("weatherResult").innerHTML = `
                <p>Temperature: ${data.main.temp}°C</p>
                <img src="https://openweathermap.org/img/w/${data.weather[0].icon}.png">
                <p>${data.weather[0].description}</p>
                `;
            })
            .catch(error => console.error('Error fetching weather data:', error));
                
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
